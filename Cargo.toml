[workspace]
resolver = "2"
members = ["kss-core", "kss-editor"]

[profile.dev]
opt-level = 1

[workspace.lints.clippy]
# The editor never panics: a ROM, a file or a click is untrusted input, and a
# bad one is reported as an error, not a crash. Tests are exempt (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# `chunks_exact(2)` over byte pairs reads better here than `as_chunks`.
chunks_exact_to_as_chunks = "allow"
